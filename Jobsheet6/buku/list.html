<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SIMPUS-Mini | Daftar Buku</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
      <div class="container">
        <a class="navbar-brand" href="../index.html">SIMPUS-Mini</a>

        <button class="navbar-toggler" type="button" id="nav-toggle-btn" aria-label="Menu">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="../index.html">Beranda</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="../buku/list.html">Daftar Buku</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../buku/tambah.html">Tambah Buku</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../anggota/list.html">Daftar Anggota</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container my-4">
      <section>
        <h2 class="mb-3">Daftar Buku</h2>

        <div class="search-box">
          <label for="search-input">Cari Judul Buku</label>
          <input type="text" id="search-input" placeholder="Ketik judul buku..." />
        </div>

        <p id="loading-indicator" style="display:none;">Memuat data...</p>

        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle">
            <thead class="table-success">
              <tr>
                <th>Judul</th>
                <th>Pengarang</th>
                <th>Tahun</th>
                <th>Stok</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody>
              <!-- Baris diisi dinamis oleh assets/js/buku.js via fetch('../data/buku.json') -->
            </tbody>
            <tfoot>
              <tr>
                <th>Judul</th>
                <th>Pengarang</th>
                <th>Tahun</th>
                <th>Stok</th>
                <th>Aksi</th>
              </tr>
            </tfoot>
          </table>
        </div>
      </section>
    </main>

    <footer class="text-center py-4">
      <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 6</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/buku.js"></script>
  </body>

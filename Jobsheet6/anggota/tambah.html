<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SIMPUS-Mini | Tambah Anggota</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>

  <body>
    <header class="navbar navbar-expand-lg navbar-dark" style="background-color:#1d5b8a;">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="../index.html">SIMPUS-Mini</a>

        <button class="navbar-toggler" type="button" id="nav-toggle-btn" aria-label="Menu">
          <span class="navbar-toggler-icon"></span>
        </button>

        <nav class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="../index.html">Beranda</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../buku/list.html">Daftar Buku</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="list.html">Daftar Anggota</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="tambah.html">Tambah Anggota</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container my-4">
      <section class="card shadow-sm">
        <div class="card-body">
          <h2 class="card-title mb-3" style="color:#1d5b8a;">Tambah Anggota</h2>

          <form id="form-tambah" novalidate>
            <div class="mb-3">
              <label for="nama" class="form-label">Nama</label>
              <input type="text" class="form-control" id="nama" name="nama" required />
            </div>

            <div class="mb-3">
              <label for="no_anggota" class="form-label">No. Anggota</label>
              <input type="text" class="form-control" id="no_anggota" name="no_anggota" required />
            </div>

            <div class="mb-3">
              <label for="alamat" class="form-label">Alamat</label>
              <input type="text" class="form-control" id="alamat" name="alamat" />
            </div>

            <div class="mb-3">
              <label for="no_hp" class="form-label">No. HP</label>
              <input type="text" class="form-control" id="no_hp" name="no_hp" />
            </div>

            <button type="submit" class="btn" style="background-color:#1d5b8a; color:#fff;">Simpan</button>
          </form>
        </div>
      </section>
    </main>

    <footer class="text-center py-4">
      <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 5</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../assets/js/app.js"></script>
  </body>
</html>
